---
version: 2
updates:
  # Docker dependencies
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    assignees:
      - "nanjb"
      - "griggs8"
      - "xzhangberkeley"
    ignore:
      # ignore 8.4 until OIDC library library supports it
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    cooldown:
      exclude:
        - "php"

  # PHP dependencies
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
    assignees:
      - "nanjb"
      - "griggs8"
      - "xzhangberkeley"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "nanjb"
      - "griggs8"
      - "xzhangberkeley"
